# ==========================================================================
# publish-ghcr.yml — Builda a imagem na nuvem (GitHub Actions) e publica no
# GitHub Container Registry (GHCR). O servidor do cliente apenas faz
# "docker compose pull" da imagem pronta (sem baixar apt/PyPI/wkhtmltopdf).
#
# Disparos:
#   - push de tag semver  (ex.: v1.0.0)  -> publica tags 1.0.0, 1.0, latest
#   - manual (workflow_dispatch)         -> publica apenas "manual-<sha7>"
#                                           (NÃO toca em latest — seguro p/ testes)
#
# A imagem fica em: ghcr.io/<owner>/<repo>  (ex.: ghcr.io/walterrosa2/seu-repo-sbk)
# Pacote PÚBLICO => o cliente puxa a imagem sem docker login/PAT.
# ==========================================================================

name: Publish image to GHCR

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}   # owner/repo em minúsculas

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/') }}
            type=sha,prefix=manual-,format=short,enable=${{ github.event_name == 'workflow_dispatch' }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
